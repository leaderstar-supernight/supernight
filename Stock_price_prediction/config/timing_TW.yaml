# 第二階段獨立設定；不更動 WHID 權重。所有門檻都是尚待驗證的研究假設。
data:
  finmind_config: ../../config/TW.yaml
  benchmark: TAIEX
  years: 5
  yahoo_adjusted_fallback: true
  cache_hours: 12
  max_price_age_days: 5
candidates:
  report_path: null             # null：搜尋專案 reports 中最新的 TW 報表
  tickers: []                    # 有值時只處理明確指定的代號，須包含 .TW / .TWO
  max_stocks: null                # 避免初次執行大量下載；null 表示全部
  max_whid_age_days: 14
  holdings_path: null           # 可選 CSV：代號,股數,平均成本；不提供也能分析
rules:
  short_fast_ma: 5
  short_slow_ma: 20
  short_slope_days: 3
  fast_ma: 20
  slow_ma: 60
  slope_days: 5
  long_fast_ma: 120
  long_slow_ma: 240
  long_slope_days: 20
  volume_ratio_min: 1.0
  max_extension: 0.10
  max_atr_pct: 0.06
  min_daily_turnover: 20000000
  chip_days: 5
  chip_lag_sessions: 1          # 研究時保守延遲一個交易日使用籌碼
  require_chip_for_entry: true
  chip_kline_enabled: true
  chip_history_days: 90
  margin_overheat_growth: 0.10  # 近N日融資餘額增加10%，且股價同期間上漲，標示散戶槓桿過熱
  lending_volume_ratio_high: 0.05
  branch_data_enabled: true      # FinMind sponsor限定；無權限時自動降級，不影響法人/融資/借券
  branch_top_n: 5
  branch_pressure_threshold: 0.02
  atr_stop_multiple: 2.0
sentiment:
  enabled: true
  news_enabled: true
  news_count: 20
  news_min_articles: 2
  news_positive_threshold: 0.15
  news_negative_threshold: -0.15
  market_history_days: 365
  margin_pressure_growth: 0.05
  margin_utilization_high: 0.60
  # 市場／個股／新聞情緒與融資壓力目前只供研究，不參與建議、回測或AI特徵。
ai:
  enabled: true
  models: [logistic, xgboost, lstm, momentum_benchmark]
  ensemble_models: [logistic, xgboost] # LSTM先作挑戰模型，通過樣本外驗證後才加入集成
  horizon: 10
  up_atr: 1.5
  down_atr: 1.0
  sequence_length: 60
  min_train: 252
  calibration_size: 252 # 盤整類較少，以一年交易日校準避免短窗樣本不足
  validation_size: 63
  final_test: 126
  min_class_count: 10
  seed: 42
  lstm_hidden: 32
  lstm_dropout: 0.20
  lstm_learning_rate: 0.001
  lstm_epochs: 40
  lstm_batch_size: 64
  lstm_patience: 5
  lstm_validation_size: 42
  lstm_walk_forward: false # 避免每個滾動區間重訓；仍執行最終測試與最新模型
  # AI 為研究參考，永不參與下方交易規則或 WHID 分數
backtest:
  enabled: true
  initial_cash: 1000000
  fee_rate: 0.001425
  sell_tax_rate: 0.003
  slippage: 0.001
  max_holding_sessions: 20
  stop_loss: 0.08
  take_profit: 0.15
  evaluation_sessions: 252
output:
  root: ../../reports
  system_root: ../../system_data
